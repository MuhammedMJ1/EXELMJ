<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXELMJ</title>
    <style>
      html,
      body,
      #app,
      #word-app {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
      }
      /* Word/design/photo containers start hidden; the mode pill flips them. */
      #word-app,
      #design-app,
      #photo-app {
        display: none;
        position: fixed;
        inset: 0;
        background: #f2f4f7;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="word-app"></div>
    <div id="design-app"></div>
    <div id="photo-app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
